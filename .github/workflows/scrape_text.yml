name: Text Manifest Pull
on:
  workflow_dispatch: # Triggers the payload sequence manually with a single click

jobs:
  extract_stream:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code Map
        uses: actions/checkout@v4

      - name: Fetch Encrypted API Text Frame
        run: |
          # Use curl directly inside the Microsoft/GitHub cloud data center to target the site
          curl -s -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36" "https://www.instagram.com/" -o raw_feed.txt
          
          # Clean, sanitize, and format the output into a plain text summary block
          echo "### Sync Complete" > instagram_manifest.md
          echo "\`\`\`text" >> instagram_manifest.md
          head -n 250 raw_feed.txt >> instagram_manifest.md
          echo "\`\`\`" >> instagram_manifest.md

      - name: Push Manifest Log to Repository
        run: |
          git config --global user.name "Automated Agent"
          git config --global user.email "agent@github.com"
          git add instagram_manifest.md
          git commit -m "Update static payload log" || echo "Zero changes detected"
          git push
